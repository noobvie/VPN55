# =============================================================================
# nginx vhost for the VPN55 self-serve portal.
#
#   /etc/nginx/sites-available/vpn55-portal.conf  (+ symlink into sites-enabled)
#
# Replace the two placeholders and nothing else:
#   __PORTAL_HOST__    the name on the certificate, e.g. vpn.example.com
#   __PORTAL_PORT__    the portal's own port, matching `portal_port` in panel.conf
# =============================================================================
#
# ── THIS ONE IS MEANT TO BE REACHABLE, AND THAT IS THE DIFFERENCE ───────────
#
# Read deploy/nginx/vpn55-panel.conf first. Everything it says about binding to
# an address rather than a bare port is the opposite of what this file does, and
# the reason is worth being clear about rather than assuming:
#
#   THE PANEL   is for the operator. It binds to the tunnel address, because a
#               stranger's packet should never arrive at all.
#   THE PORTAL  is for the people being served, who are NOT on the tunnel —
#               fetching their configuration is how they get on it. It listens
#               on the public address, because being reachable is the point.
#
# ⚠ So this vhost is the one part of VPN55 exposed to the internet, and the
# reason it is safe to expose is that on the socket underneath it there is no
# admin route to reach. The panel and the portal are two separate express
# applications in one process; the admin router is attached to one of them. A
# request to /api/admin here does not hit a guard — it hits nothing at all.
# docs/security-model.md §6F.
#
# ── Certificates: HTTP-01 works here, unlike the panel ──────────────────────
#
# This host answers on port 80 and 443 from the internet, so the ordinary
# bootstrap applies and DNS-01 is not required:
#
#   1. install this file with ONLY the port-80 server block below (comment the
#      443 block out, or write it after step 3),
#   2. nginx -t && systemctl reload nginx,
#   3. certbot --nginx -d __PORTAL_HOST__,
#   4. then the 443 block.
#
# ⚠ Never install a vhost referencing /etc/letsencrypt/live/…/fullchain.pem
# before the certificate exists. nginx -t hard-fails on a missing certificate
# path, a failed nginx -t means a failed reload, and a failed reload means every
# other site on this box keeps serving its old config — or, after a restart,
# none of them serve at all.
# =============================================================================

# Port 80: the certbot challenge path, and a redirect for everyone else. There
# is no content here — a person who types the hostname gets sent to https.
server {
    listen 80;
    listen [::]:80;
    server_name __PORTAL_HOST__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `ssl http2` on the listen line rather than a separate `http2 on;`: the
    # latter is nginx 1.25.1+ only and is an unknown directive — a hard nginx -t
    # failure — on anything older, which includes current Debian stable.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name __PORTAL_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__PORTAL_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PORTAL_HOST__/privkey.pem;

    # A glob: one that matches nothing is fine, while a plain include of a
    # missing file fails nginx -t, and certbot does not always write this.
    include /etc/letsencrypt/options-ssl-nginx.conf*;

    # ── Headers ─────────────────────────────────────────────────────────────
    # ⚠ add_header in a nested block DISCARDS every add_header inherited from
    # its parent — all of them, not just the one being overridden. A location
    # block that adds a header of its own must repeat this whole set, or the
    # portal silently loses its policy on exactly that route. That is the normal
    # way a CSP goes missing, and this file has one such block below.
    #
    # The portal sets the same headers itself, from server.js, which is what
    # actually protects it. These cover the responses nginx generates on its own
    # — a 502 while the service restarts, a 413, a redirect.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # ⚠ This one is doing real work here, unlike on the panel. The portal is
    # publicly reachable, so a crawler CAN find it — and a portal URL in a search
    # index is a list of somewhere worth probing.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ── UTF-8, for the responses nginx writes itself ────────────────────────
    # Everything proxied carries its own charset. What is not proxied is nginx's
    # own output, and the default locale is Vietnamese: an error page with no
    # charset is an error page rendered in the browser's guess. `charset` only
    # ADDS one where a response has none, so it cannot fight the portal.
    charset utf-8;

    gzip on;
    gzip_types application/json text/css application/javascript;

    # Nothing here takes a large body — the biggest request is an access code.
    client_max_body_size 16k;

    access_log /var/log/nginx/vpn55-portal.access.log;
    error_log  /var/log/nginx/vpn55-portal.error.log;

    location / {
        proxy_pass http://127.0.0.1:__PORTAL_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠ Setting this header is not the same as the portal BELIEVING it.
        # `portal_trust_proxy` defaults to 1 AND the panel refuses to start
        # unless `portal_bind` is a loopback address — because the header is only
        # worth believing when nothing but this vhost can reach the socket, and
        # only a loopback bind guarantees that. Do not move the portal onto a
        # reachable address and leave that setting on; the panel will refuse,
        # which is the intended outcome.
        proxy_connect_timeout 5s;
        proxy_read_timeout    65s;
    }

    # Fetching a configuration and replacing a credential both wait on a root
    # helper that talks to a daemon. On a busy host that is slower than a page
    # load, and a 504 here reads to a user as "the VPN is broken" rather than as
    # "this took a moment".
    location /api/portal/creds/ {
        proxy_pass http://127.0.0.1:__PORTAL_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90s;

        # Repeated deliberately: this block adds a header of its own below, and
        # doing so discards everything add_header set in the parent. See the
        # warning above — the repetition is the fix, not an oversight.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # A response carrying somebody's private key must not be cached by
        # anything, ever. The portal says so itself; this covers the case where
        # nginx answers instead.
        add_header Cache-Control "no-store" always;
    }

    # ⚠ There is deliberately NO block for /api/admin here, and adding one would
    # be a serious mistake. The admin routes live on the panel's own listener,
    # behind the panel's own vhost, on the tunnel address. Proxying them from
    # this public vhost would put the one thing on this host that can revoke
    # access onto the internet, and it would undo the entire arrangement
    # described at the top of this file.
}
