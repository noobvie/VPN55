# =============================================================================
# nginx vhost for the VPN55 admin panel.
#
#   /etc/nginx/sites-available/vpn55-panel.conf  (+ symlink into sites-enabled)
#
# Replace the three placeholders and nothing else:
#   __PANEL_HOST__     the name on the certificate, e.g. panel.example.com
#   __TUNNEL_IP__      this host's address ON THE TUNNEL, e.g. 10.55.0.1
#   __PANEL_PORT__     the panel's own port, matching `port` in panel.conf
# =============================================================================
#
# ── THE LISTEN LINE IS THE ACCESS CONTROL ───────────────────────────────────
#
# `listen __TUNNEL_IP__:443 ssl;` — an address, never a bare port.
#
#     listen 443 ssl;                    # + allow/deny rules
#
# is NOT the same thing and is not a smaller version of it. A bare port listens
# on every interface including the public one, so a stranger's packet arrives,
# the TCP handshake completes, the TLS handshake completes, and nginx parses
# their request before any allow/deny rule is consulted. Everything up to that
# point is attack surface: the TLS stack, the certificate (which is now
# disclosed, along with the hostname), and whatever their request triggers on
# the way to being refused. An address-bound socket means the packet is never
# accepted by this host at all.
#
# The panel behind it binds to loopback, so even something else on the tunnel
# cannot reach it except through this vhost.
#
# ── Certificates: DNS-01, and why there is no HTTP block below ──────────────
#
# The usual bootstrap dance — HTTP-only vhost, reload, certbot --nginx, then the
# SSL vhost — exists because HTTP-01 validation needs port 80 reachable from the
# internet. This panel has no port reachable from the internet, by design, so
# HTTP-01 cannot work here and there is nothing to bootstrap.
#
# Get the certificate FIRST, with DNS-01, with no nginx config in place at all:
#
#     certbot certonly --dns-<your-provider> \
#             --dns-<your-provider>-credentials /etc/letsencrypt/<provider>.ini \
#             -d __PANEL_HOST__
#
# ⚠ Only then write this file. nginx -t HARD-FAILS on a ssl_certificate path
# that does not exist yet, and a failed `nginx -t` means a failed reload, which
# means every other site on this box keeps serving the old config — or, after a
# restart, none of them serve at all. Never install a vhost that references a
# certificate that has not been issued.
#
# ⚠ __PANEL_HOST__ must still resolve, in whatever DNS the admin's machine uses,
# to __TUNNEL_IP__. A public A record pointing at a private address is normal
# and fine for this; it is not a leak, and split-horizon DNS is not required.
# =============================================================================

server {
    # `ssl http2` on the listen line rather than a separate `http2 on;`: the
    # latter is nginx 1.25.1+ only and is an unknown directive — a hard nginx -t
    # failure — on anything older, which includes the nginx in current Debian
    # stable. This form works on every version; new nginx logs a deprecation
    # notice for it and carries on.
    listen __TUNNEL_IP__:443 ssl http2;

    server_name __PANEL_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__PANEL_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PANEL_HOST__/privkey.pem;

    # The trailing * makes this a glob: a glob that matches nothing is fine,
    # while a plain include of a missing file fails nginx -t. certbot in
    # certonly mode does not always write this file.
    include /etc/letsencrypt/options-ssl-nginx.conf*;

    # No ssl_dhparam. It has no glob form, so referencing a file certonly may
    # not have written would fail nginx -t — and it buys nothing here: these are
    # ECDHE suites, and the DH parameters would never be used.

    # ── Headers ─────────────────────────────────────────────────────────────
    # ⚠ add_header in a nested block DISCARDS every add_header inherited from
    # its parent — all of them, not just the one being overridden. If a location
    # block below ever adds a header of its own, it must repeat this whole set,
    # or this panel silently loses its CSP on exactly that route. That is not a
    # hypothetical failure mode; it is the normal way a CSP goes missing.
    #
    # The panel sets the same headers itself, from server.js, which is what
    # actually protects it — these are here so a response nginx generates on its
    # own (an error page, a redirect) carries them too.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # An admin panel is not for indexing, and it is not reachable by a crawler
    # anyway — but the header costs nothing and covers the case where someone
    # later exposes it deliberately.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ── UTF-8, for the responses nginx writes itself ────────────────────────
    #
    # Everything proxied carries its own charset: express labels HTML, JSON, CSS
    # and JS `; charset=utf-8` and nginx passes that through untouched. What is
    # NOT proxied is nginx's own output — a 502 when the panel is down, a 413 on
    # an oversized body — and those are generated here.
    #
    # The default locale is Vietnamese, so an error page without a charset is an
    # error page rendered in the browser's guess. `charset` only ADDS a charset
    # to a response that has none; it never overrides one, so this cannot fight
    # with what the panel sends.
    charset utf-8;

    # The panel's pages are small; the state payload is the only thing that
    # grows, and it is JSON.
    gzip on;
    gzip_types application/json text/css application/javascript;

    client_max_body_size 64k;

    access_log /var/log/nginx/vpn55-panel.access.log;
    error_log  /var/log/nginx/vpn55-panel.error.log;

    location / {
        proxy_pass http://127.0.0.1:__PANEL_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠ Setting these headers is not the same as the panel BELIEVING them.
        # `trust_proxy` in panel.conf is 0 by default and should stay 0 until
        # Phase 6, when the login lockout starts keying on the client IP. At that
        # point it must become 1 — and it is only safe to be 1 because the panel
        # listens on loopback, so this vhost is the only thing that can reach it
        # and therefore the only thing that can set the header. A panel that
        # trusted this header while reachable directly would let a caller invent
        # a new client IP per request and never be locked out.
        proxy_connect_timeout 5s;
        proxy_read_timeout    65s;
    }

    # The status read can take a moment on a busy host; the page it feeds is the
    # one an operator is staring at while wondering why. Give it room rather than
    # returning a 504 that looks like the panel is down.
    location /api/state {
        proxy_pass http://127.0.0.1:__PANEL_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90s;

        # Repeated deliberately: this block adds a header of its own below, and
        # doing so discards everything add_header set in the parent. See the
        # warning above — this repetition is the fix, not an oversight.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
}
